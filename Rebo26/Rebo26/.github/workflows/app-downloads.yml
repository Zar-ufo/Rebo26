name: Build Rebo app downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/windows/package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix native/windows
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: rebo-windows
          path: release/Rebo-Setup.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/windows/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms/android-36" "build-tools/36.0.0" "ndk/27.1.12297006" "cmake/3.22.1"
      - run: npm ci
        working-directory: mobile
      - run: npm run build:apk
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: rebo-android
          path: release/Rebo-Android.apk
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-downloads
          name: Rebo app downloads
          body: Windows installer and Android APK for the hosted Rebo app.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            release-assets/Rebo-Setup.exe
            release-assets/Rebo-Android.apk
